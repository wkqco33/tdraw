name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Go 설치
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 의존성 다운로드
        run: go mod download

      - name: 빌드
        run: make build

      - name: 테스트
        run: make test

      - name: 정적 분석
        run: make vet
