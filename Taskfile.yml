version: '3'

vars:
  BIN: tdraw
  DISTDIR: dist
  GO: go
  GOFLAGS: -trimpath
  # 빌드 버전: git describe 결과, 실패 시 dev
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  LDFLAGS: -s -w -X main.version={{.VERSION}}
  # 설치 경로 (Unix). Windows에서는 install/uninstall 태스크가 비활성화됨
  BINDIR:
    sh: echo "${HOME}/.local/bin"
  PLATFORMS: linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64

tasks:
  default:
    desc: 기본 태스크 (build)
    cmds:
      - task: build

  build:
    desc: 현재 플랫폼용 바이너리 빌드 (비디오 재생 미포함, 순수 Go)
    cmds:
      - "CGO_ENABLED=0 {{.GO}} build {{.GOFLAGS}} -ldflags \"{{.LDFLAGS}}\" -o {{.BIN}} ./cmd/tdraw"

  setup:video:
    desc: 비디오 빌드/테스트용 go.work 구성 (tcamviewer 체크아웃 필요, 기본 ../tcamviewer)
    cmds:
      - test -f go.work || go work init
      - go work use . "${TCAMVIEWER_DIR:-../tcamviewer}"

  build:video:
    desc: 비디오 재생(tcamviewer) 포함 빌드 — tcamviewer 코어가 빌드되어 있어야 한다
    deps: [setup:video]
    cmds:
      - "{{.GO}} build -tags tcamviewer {{.GOFLAGS}} -ldflags \"{{.LDFLAGS}}\" -o {{.BIN}} ./cmd/tdraw"

  test:
    desc: 테스트 실행
    cmds:
      - "{{.GO}} test ./... -v"

  test:video:
    desc: 비디오 재생(tcamviewer 연동) 포함 테스트 실행
    deps: [setup:video]
    cmds:
      - "{{.GO}} test -tags tcamviewer ./... -v"

  fmt:
    desc: 코드 포맷
    cmds:
      - "{{.GO}} fmt ./..."

  vet:
    desc: 정적 분석
    cmds:
      - "{{.GO}} vet ./..."

  release-plain:
    desc: release 태스크 별칭 (하위 호환용)
    cmds:
      - task: release

  release:
    desc: PPM용 플랫폼별 기본 아카이브와 SHA-256 체크섬을 dist/ 에 생성 (순수 Go 정적 바이너리)
    deps: [clean-dist]
    cmds:
      - mkdir -p {{.DISTDIR}}
      - |
        for platform in {{.PLATFORMS}}; do
          os=${platform%/*}
          arch=${platform#*/}
          binary_name="{{.BIN}}"
          archive_ext=".tar.gz"
          if [ "$os" = "windows" ]; then
            binary_name="{{.BIN}}.exe"
            archive_ext=".zip"
          fi

          binary="{{.DISTDIR}}/$binary_name"
          archive="{{.DISTDIR}}/{{.BIN}}_${os}_${arch}${archive_ext}"
          echo "빌드: $archive"
          CGO_ENABLED=0 GOOS=$os GOARCH=$arch {{.GO}} build {{.GOFLAGS}} -ldflags "{{.LDFLAGS}}" -o "$binary" ./cmd/tdraw

          if [ "$os" = "windows" ]; then
            zip -q -j "$archive" "$binary"
            unzip -tq "$archive"
          else
            tar -czf "$archive" -C "{{.DISTDIR}}" "$binary_name"
            tar -tzf "$archive" >/dev/null
          fi

          (cd "{{.DISTDIR}}" && sha256sum "$(basename "$archive")" > "$(basename "$archive").sha256")
          rm -f "$binary"
        done
      - 'echo "완료: {{.DISTDIR}}/"'
      - ls -lh {{.DISTDIR}}/

  release:video:
    desc: 비디오 재생(tcamviewer) 포함 Linux 아카이브 생성 (tcamviewer 코어 빌드 필요)
    cmds:
      - mkdir -p {{.DISTDIR}}
      - |
        task build:video
        cp {{.BIN}} {{.BIN}}-video
        archive="{{.DISTDIR}}/{{.BIN}}_video_linux_$(go env GOARCH).tar.gz"
        tar -czf "$archive" {{.BIN}} {{.BIN}}-video
        rm -f {{.BIN}}-video
        (cd "{{.DISTDIR}}" && sha256sum "$(basename "$archive")" > "$(basename "$archive").sha256")
        echo "완료: $archive"
        ls -lh {{.DISTDIR}}/

  install:
    desc: "~/.local/bin 에 바이너리 설치 (Unix 전용)"
    platforms: [linux, darwin]
    deps: [build]
    cmds:
      - mkdir -p {{.BINDIR}}
      - install -m 755 {{.BIN}} {{.BINDIR}}/{{.BIN}}
      - 'echo "설치 완료: {{.BINDIR}}/{{.BIN}}"'

  uninstall:
    desc: 설치된 바이너리 삭제 (Unix 전용)
    platforms: [linux, darwin]
    cmds:
      - rm -f {{.BINDIR}}/{{.BIN}}
      - 'echo "삭제 완료: {{.BINDIR}}/{{.BIN}}"'

  clean:
    desc: 빌드 결과물 삭제
    cmds:
      - rm -f {{.BIN}} {{.BIN}}.exe

  clean-dist:
    desc: dist/ 디렉토리 삭제
    cmds:
      - rm -rf {{.DISTDIR}}
