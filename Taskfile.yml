version: '3'

vars:
  BIN: tdraw
  DISTDIR: dist
  GO: go
  GOFLAGS: -trimpath
  # 빌드 버전: git describe 결과, 실패 시 dev
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  LDFLAGS: -s -w -X main.version={{.VERSION}}
  # 설치 경로 (Unix). Windows에서는 install/uninstall 태스크가 비활성화됨
  BINDIR:
    sh: echo "${HOME}/.local/bin"
  PLATFORMS: linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64

tasks:
  default:
    desc: 기본 태스크 (build)
    cmds:
      - task: build

  build:
    desc: 현재 플랫폼용 기본 바이너리 빌드 (Linux는 비디오 재생 포함)
    cmds:
      - |
        if [ "$(go env GOOS)" = "linux" ]; then
          task build:video
        else
          task build:plain
        fi

  build:plain:
    desc: 현재 플랫폼용 순수 Go 바이너리 빌드 (비디오 재생 미포함)
    cmds:
      - "CGO_ENABLED=0 {{.GO}} build {{.GOFLAGS}} -ldflags \"{{.LDFLAGS}}\" -o {{.BIN}} ./cmd/tdraw"

  setup:video:
    desc: pkg.go.dev tcamviewer 모듈과 네이티브 코어 라이브러리 확인
    cmds:
      - "GOWORK=off {{.GO}} mod download github.com/wkqco33/tcamviewer"
      - |
        lib_dir="${TCAMVIEWER_LIB_DIR:-../tcamviewer/build}"
        if [ ! -f "$lib_dir/libtcamviewer.so" ] && [ ! -f "$lib_dir/libtcamviewer.a" ]; then
          echo "libtcamviewer.so 또는 libtcamviewer.a가 없습니다: $lib_dir" >&2
          echo "네이티브 코어를 빌드한 뒤 TCAMVIEWER_LIB_DIR로 경로를 지정하세요." >&2
          exit 1
        fi

  build:video:
    desc: pkg.go.dev tcamviewer 모듈과 네이티브 코어로 비디오 포함 빌드
    deps: [setup:video]
    cmds:
      - |
        lib_dir="$(cd "${TCAMVIEWER_LIB_DIR:-../tcamviewer/build}" && pwd)"
        export GOWORK=off CGO_ENABLED=1
        export CGO_LDFLAGS="${CGO_LDFLAGS:+$CGO_LDFLAGS }-L${lib_dir} -Wl,-rpath,${lib_dir}"
        {{.GO}} build -tags tcamviewer {{.GOFLAGS}} -ldflags "{{.LDFLAGS}}" -o {{.BIN}} ./cmd/tdraw

  test:
    desc: 테스트 실행
    cmds:
      - "{{.GO}} test ./... -v"

  test:video:
    desc: pkg.go.dev tcamviewer 모듈 연동 테스트 실행
    deps: [setup:video]
    cmds:
      - |
        lib_dir="$(cd "${TCAMVIEWER_LIB_DIR:-../tcamviewer/build}" && pwd)"
        export GOWORK=off CGO_ENABLED=1
        export CGO_LDFLAGS="${CGO_LDFLAGS:+$CGO_LDFLAGS }-L${lib_dir} -Wl,-rpath,${lib_dir}"
        {{.GO}} test -tags tcamviewer ./... -v

  fmt:
    desc: 코드 포맷
    cmds:
      - "{{.GO}} fmt ./..."

  vet:
    desc: 정적 분석
    cmds:
      - "{{.GO}} vet ./..."

  release-plain:
    desc: release 태스크 별칭 (하위 호환용)
    cmds:
      - task: release

  release:
    desc: 플랫폼별 순수 Go 아카이브와 SHA-256 체크섬을 dist/ 에 생성 (Linux 파일명에 _plain 표시)
    deps: [clean-dist]
    cmds:
      - mkdir -p {{.DISTDIR}}
      - |
        for platform in {{.PLATFORMS}}; do
          os=${platform%/*}
          arch=${platform#*/}
          binary_name="{{.BIN}}"
          archive_ext=".tar.gz"
          if [ "$os" = "windows" ]; then
            binary_name="{{.BIN}}.exe"
            archive_ext=".zip"
          fi

          binary="{{.DISTDIR}}/$binary_name"
          suffix=""
          if [ "$os" = "linux" ]; then
            suffix="_plain"
          fi
          archive="{{.DISTDIR}}/{{.BIN}}${suffix}_${os}_${arch}${archive_ext}"
          echo "빌드: $archive"
          CGO_ENABLED=0 GOOS=$os GOARCH=$arch {{.GO}} build {{.GOFLAGS}} -ldflags "{{.LDFLAGS}}" -o "$binary" ./cmd/tdraw

          if [ "$os" = "windows" ]; then
            zip -q -j "$archive" "$binary"
            unzip -tq "$archive"
          else
            tar -czf "$archive" -C "{{.DISTDIR}}" "$binary_name"
            tar -tzf "$archive" >/dev/null
          fi

          (cd "{{.DISTDIR}}" && sha256sum "$(basename "$archive")" > "$(basename "$archive").sha256")
          rm -f "$binary"
        done
      - 'echo "완료: {{.DISTDIR}}/"'
      - ls -lh {{.DISTDIR}}/

  release:video:
    desc: Linux 기본 비디오 재생 아카이브와 호환용 _video 아카이브 생성 (tcamviewer 코어 빌드 필요)
    cmds:
      - mkdir -p {{.DISTDIR}}
      - |
        test "$(go env GOOS)" = "linux"
        task build:video
        arch=$(go env GOARCH)
        archive="{{.DISTDIR}}/{{.BIN}}_linux_${arch}.tar.gz"
        legacy_archive="{{.DISTDIR}}/{{.BIN}}_video_linux_${arch}.tar.gz"
        tar -czf "$archive" {{.BIN}}
        cp {{.BIN}} {{.BIN}}-video
        tar -czf "$legacy_archive" {{.BIN}} {{.BIN}}-video
        rm -f {{.BIN}}-video
        (cd "{{.DISTDIR}}" && sha256sum "$(basename "$archive")" > "$(basename "$archive").sha256")
        (cd "{{.DISTDIR}}" && sha256sum "$(basename "$legacy_archive")" > "$(basename "$legacy_archive").sha256")
        echo "완료: $archive, $legacy_archive"
        ls -lh {{.DISTDIR}}/

  install:
    desc: "~/.local/bin 에 바이너리 설치 (Unix 전용)"
    platforms: [linux, darwin]
    deps: [build]
    cmds:
      - mkdir -p {{.BINDIR}}
      - install -m 755 {{.BIN}} {{.BINDIR}}/{{.BIN}}
      - 'echo "설치 완료: {{.BINDIR}}/{{.BIN}}"'

  uninstall:
    desc: 설치된 바이너리 삭제 (Unix 전용)
    platforms: [linux, darwin]
    cmds:
      - rm -f {{.BINDIR}}/{{.BIN}}
      - 'echo "삭제 완료: {{.BINDIR}}/{{.BIN}}"'

  clean:
    desc: 빌드 결과물 삭제
    cmds:
      - rm -f {{.BIN}} {{.BIN}}.exe

  clean-dist:
    desc: dist/ 디렉토리 삭제
    cmds:
      - rm -rf {{.DISTDIR}}
